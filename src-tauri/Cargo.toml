[package]
name = "leonardo"
version = "0.1.0"
description = "A local-first video transcript library for creators"
authors = ["Leonardo contributors"]
edition = "2021"

[lib]
name = "leonardo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
walkdir = "2.5"
base64 = "0.22"
